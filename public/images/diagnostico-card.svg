<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082A41"/>
      <stop offset="50%" stop-color="#0F2038"/>
      <stop offset="100%" stop-color="#0A1A33"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DB6EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3DB6EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3DB6EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spineGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#59A5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A1A33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background base -->
  <rect width="800" height="600" fill="url(#diagBg)" />
  <rect width="800" height="600" fill="url(#spineGlow)" />

  <!-- Dense tech / radiologic grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- X-Ray / Scan target brackets -->
  <g stroke="#3DB6EE" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M220,130 L200,130 L200,150" />
    <path d="M580,130 L600,130 L600,150" />
    <path d="M200,450 L200,470 L220,470" />
    <path d="M600,450 L600,470 L580,470" />
  </g>

  <!-- Horizontal scan beam bar -->
  <rect x="180" y="275" width="440" height="40" fill="url(#scanBeam)" />
  <line x1="180" y1="295" x2="620" y2="295" stroke="#7DD0F7" stroke-width="1.5" opacity="0.8" />

  <!-- Stylized Spine Column (Espinograma Digital) & Digital Crosshairs -->
  <g transform="translate(400, 300)" stroke="#B9E5FB" stroke-width="2" fill="none">
    <!-- Vertebrae stylized stack -->
    <ellipse cx="0" cy="-140" rx="22" ry="10" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="-110" rx="25" ry="11" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="-80" rx="27" ry="12" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="-50" rx="30" ry="13" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="-20" rx="33" ry="14" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="10" rx="35" ry="15" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="40" rx="38" ry="16" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="70" rx="42" ry="18" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <ellipse cx="0" cy="102" rx="46" ry="20" stroke-opacity="0.85" fill="#3DB6EE" fill-opacity="0.15" />
    <!-- Spinal canal center line -->
    <line x1="0" y1="-165" x2="0" y2="135" stroke="#7DD0F7" stroke-width="2" stroke-dasharray="4 4" opacity="0.9" />

    <!-- Measure indicators / calibration ticks -->
    <line x1="-55" y1="-80" x2="-35" y2="-80" stroke="#3DB6EE" stroke-width="1.5" opacity="0.6" />
    <line x1="35" y1="-80" x2="55" y2="-80" stroke="#3DB6EE" stroke-width="1.5" opacity="0.6" />
    <line x1="-65" y1="40" x2="-45" y2="40" stroke="#3DB6EE" stroke-width="1.5" opacity="0.6" />
    <line x1="45" y1="40" x2="65" y2="40" stroke="#3DB6EE" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Watermark text -->
  <text x="400" y="490" text-anchor="middle" fill="#E0F3FE" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="4">
    DIAGNÓSTICO DIGITAL
  </text>
  <text x="400" y="520" text-anchor="middle" fill="#7DD0F7" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="2">
    ESPINOGRAMA • ALTA DEFINICIÓN
  </text>
</svg>
